<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de Propostas Comerciais - Atlas Business AI</title>
    <meta name="description" content="Crie propostas comerciais profissionais com IA em segundos">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">
</head>
<body>
    <div class="tool-page">
        <!-- Overlay mobile -->
        <div class="menu-overlay" id="menuOverlay"></div>

        <!-- Sidebar (mesma do dashboard, simplificada) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                    <rect width="32" height="32" rx="8" fill="url(#logo-grad)"/>
                    <path d="M6 24L16 6L26 24H6Z" stroke="white" stroke-width="2" fill="none" stroke-linejoin="round"/>
                    <circle cx="16" cy="20" r="2" fill="white"/>
                    <defs><linearGradient id="logo-grad" x1="0" y1="0" x2="32" y2="32"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
                </svg>
                <span class="logo-text">Atlas<span style="background: var(--color-primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Business</span>AI</span>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-section">
                    <div class="sidebar-section-title">Principal</div>
                    <a href="../dashboard.html" class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                        Dashboard
                    </a>
                    <a href="#" class="sidebar-link active">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        Propostas Comerciais
                    </a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-avatar" id="sidebarAvatar">U</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="sidebarUserName">Usuário</div>
                        <div class="sidebar-user-plan">Plano Starter</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Conteúdo da ferramenta -->
        <div class="tool-container">
            <!-- Topbar simplificada -->
            <header class="topbar" style="position:fixed; top:0; left:260px; right:0; z-index:90;">
                <button class="topbar-btn" id="mobileMenuBtn" aria-label="Menu">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <span style="font-weight:600;">Ferramenta: Criador de Propostas Comerciais</span>
                <div class="topbar-actions" style="margin-left:auto;">
                    <button class="topbar-btn" onclick="Tools.goToDashboard()" title="Voltar ao Dashboard">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                    </button>
                </div>
            </header>

            <div class="tool-header" style="margin-top:64px;">
                <h1>
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--color-primary);"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    Criador de Propostas Comerciais
                </h1>
            </div>

            <div class="tool-layout">
                <!-- Formulário -->
                <div class="tool-form-card">
                    <h2 style="font-size:1.1rem;font-weight:700;margin-bottom:20px;">Preencha os dados da proposta</h2>
                    <form id="propostaForm" novalidate>
                        <div class="form-group">
                            <label for="nomeEmpresa" class="form-label">Nome da sua Empresa *</label>
                            <input type="text" id="nomeEmpresa" placeholder="Ex: Atlas Tecnologia Ltda" required>
                        </div>
                        <div class="form-group">
                            <label for="nomeCliente" class="form-label">Nome do Cliente *</label>
                            <input type="text" id="nomeCliente" placeholder="Ex: Empresa ABC" required>
                        </div>
                        <div class="form-group">
                            <label for="servico" class="form-label">Serviço/Produto Oferecido *</label>
                            <input type="text" id="servico" placeholder="Ex: Desenvolvimento de Website" required>
                        </div>
                        <div class="form-group">
                            <label for="valor" class="form-label">Valor Total (R$) *</label>
                            <input type="number" id="valor" placeholder="Ex: 5000" min="0" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="prazo" class="form-label">Prazo de Entrega</label>
                            <input type="text" id="prazo" placeholder="Ex: 30 dias">
                        </div>
                        <div class="form-group">
                            <label for="condicoes" class="form-label">Condições de Pagamento</label>
                            <input type="text" id="condicoes" placeholder="Ex: 50% entrada, 50% na entrega">
                        </div>
                        <div class="form-group">
                            <label for="diferenciais" class="form-label">Diferenciais (separados por vírgula)</label>
                            <textarea id="diferenciais" placeholder="Ex: Suporte 24/7, Garantia de 1 ano, Equipe certificada" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block" id="gerarBtn">
                            Gerar Proposta
                        </button>
                    </form>
                </div>

                <!-- Resultado -->
                <div class="tool-result-card" id="resultCard">
                    <div class="tool-empty" id="emptyState">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        <p>Preencha o formulário e clique em "Gerar Proposta" para ver o resultado aqui.</p>
                    </div>
                    <div class="tool-result-content" id="resultContent" style="display:none;"></div>
                    <div class="tool-result-actions" id="resultActions" style="display:none;">
                        <button class="btn btn-outline btn-sm" onclick="copiarResultado()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                            Copiar
                        </button>
                        <button class="btn btn-outline btn-sm" onclick="baixarTXT()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            Baixar TXT
                        </button>
                        <button class="btn btn-outline btn-sm" onclick="novaProposta()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                            Nova Proposta
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../assets/js/tools.js"></script>
    <script>
        // Inicializa módulo comum
        Tools.init();

        let resultadoGerado = '';

        // Gerar proposta
        document.getElementById('propostaForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nomeEmpresa = document.getElementById('nomeEmpresa').value.trim();
            const nomeCliente = document.getElementById('nomeCliente').value.trim();
            const servico = document.getElementById('servico').value.trim();
            const valor = document.getElementById('valor').value.trim();
            const prazo = document.getElementById('prazo').value.trim();
            const condicoes = document.getElementById('condicoes').value.trim();
            const diferenciais = document.getElementById('diferenciais').value.trim();

            if (!nomeEmpresa || !nomeCliente || !servico || !valor) {
                Tools.showToast('Preencha todos os campos obrigatórios.', 'error');
                return;
            }

            const stopLoading = Tools.showLoading(document.getElementById('gerarBtn'));

            // Simula chamada de IA (substituir por API real)
            setTimeout(() => {
                // Gera proposta formatada
                const dataAtual = new Date().toLocaleDateString('pt-BR');
                const listaDiferenciais = diferenciais ? diferenciais.split(',').map(d => `- ${d.trim()}`).join('\n') : '';

                resultadoGerado = `PROPOSTA COMERCIAL

Empresa: ${nomeEmpresa}
Data: ${dataAtual}

À ${nomeCliente},

Prezado(a),

Agradecemos a oportunidade e temos o prazer de apresentar nossa proposta para ${servico}.

VALOR E CONDIÇÕES:
Valor Total: R$ ${parseFloat(valor).toLocaleString('pt-BR', {minimumFractionDigits: 2})}
Prazo: ${prazo || 'A combinar'}
Condições de Pagamento: ${condicoes || 'A combinar'}

${diferenciais ? 'DIFERENCIAIS:\n' + listaDiferenciais + '\n' : ''}
Estamos à disposição para esclarecimentos e ansiamos por uma parceria de sucesso.

Atenciosamente,
Equipe ${nomeEmpresa}`;

                // Exibe resultado
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('resultContent').style.display = 'block';
                document.getElementById('resultContent').textContent = resultadoGerado;
                document.getElementById('resultActions').style.display = 'flex';

                stopLoading();
                Tools.showToast('Proposta gerada com sucesso!', 'success');
            }, 1500);
        });

        function copiarResultado() {
            if (resultadoGerado) {
                Tools.copyToClipboard(resultadoGerado);
            }
        }

        function baixarTXT() {
            if (resultadoGerado) {
                Tools.downloadFile(resultadoGerado, 'proposta-comercial.txt');
            }
        }

        function novaProposta() {
            document.getElementById('propostaForm').reset();
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('resultContent').style.display = 'none';
            document.getElementById('resultActions').style.display = 'none';
            resultadoGerado = '';
        }
    </script>
</body>
</html>
