<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Inteligente - Atlas Business AI</title>
    <meta name="description" content="Calcule preço, lucro, margem e markup automaticamente">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">
</head>
<body>
    <div class="tool-page">
        <div class="menu-overlay" id="menuOverlay"></div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                    <rect width="32" height="32" rx="8" fill="url(#logo-grad)"/>
                    <path d="M6 24L16 6L26 24H6Z" stroke="white" stroke-width="2" fill="none" stroke-linejoin="round"/>
                    <circle cx="16" cy="20" r="2" fill="white"/>
                    <defs><linearGradient id="logo-grad" x1="0" y1="0" x2="32" y2="32"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
                </svg>
                <span class="logo-text">Atlas<span style="background: var(--color-primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Business</span>AI</span>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-section">
                    <div class="sidebar-section-title">Principal</div>
                    <a href="../dashboard.html" class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                        Dashboard
                    </a>
                    <a href="#" class="sidebar-link active">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="3"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg>
                        Calculadora
                    </a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-avatar" id="sidebarAvatar">U</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="sidebarUserName">Usuário</div>
                        <div class="sidebar-user-plan">Plano Starter</div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="tool-container">
            <header class="topbar" style="position:fixed; top:0; left:260px; right:0; z-index:90;">
                <button class="topbar-btn" id="mobileMenuBtn" aria-label="Menu">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <span style="font-weight:600;">Ferramenta: Calculadora Inteligente</span>
                <div class="topbar-actions" style="margin-left:auto;">
                    <button class="topbar-btn" onclick="Tools.goToDashboard()" title="Voltar ao Dashboard">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                    </button>
                </div>
            </header>

            <div class="tool-header" style="margin-top:64px;">
                <h1>
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--color-primary);"><rect x="2" y="2" width="20" height="20" rx="3"/></svg>
                    Calculadora Inteligente
                </h1>
            </div>

            <div class="tool-layout">
                <div class="tool-form-card">
                    <h2 style="font-size:1.1rem;font-weight:700;margin-bottom:20px;">Insira os Valores</h2>
                    <form id="calculadoraForm" novalidate>
                        <div class="form-group">
                            <label for="custo" class="form-label">Custo do Produto/Serviço (R$) *</label>
                            <input type="number" id="custo" min="0" step="0.01" placeholder="Ex: 100" required>
                        </div>
                        <div class="form-group">
                            <label for="margem" class="form-label">Margem de Lucro Desejada (%) *</label>
                            <input type="number" id="margem" min="0" step="0.1" placeholder="Ex: 30" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block" id="gerarBtn">Calcular</button>
                    </form>
                </div>

                <div class="tool-result-card" id="resultCard">
                    <div class="tool-empty" id="emptyState">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="3"/></svg>
                        <p>Insira os valores e veja o cálculo.</p>
                    </div>
                    <div class="tool-result-content" id="resultContent" style="display:none;"></div>
                    <div class="tool-result-actions" id="resultActions" style="display:none;">
                        <button class="btn btn-outline btn-sm" onclick="copiarResultado()">Copiar</button>
                        <button class="btn btn-outline btn-sm" onclick="baixarTXT()">Baixar TXT</button>
                        <button class="btn btn-outline btn-sm" onclick="novaCalculadora()">Novo Cálculo</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../assets/js/tools.js"></script>
    <script>
        Tools.init();
        let resultadoGerado = '';

        document.getElementById('calculadoraForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const custo = parseFloat(document.getElementById('custo').value);
            const margem = parseFloat(document.getElementById('margem').value);

            if (isNaN(custo) || isNaN(margem) || custo < 0 || margem < 0) {
                Tools.showToast('Insira valores válidos.', 'error');
                return;
            }

            const stopLoading = Tools.showLoading(document.getElementById('gerarBtn'));

            setTimeout(() => {
                const markup = 1 / (1 - margem / 100);
                const preco = custo * markup;
                const lucro = preco - custo;

                resultadoGerado = `CALCULADORA DE PREÇO\n\nCusto: R$ ${custo.toFixed(2)}\nMargem desejada: ${margem}%\nMarkup: ${markup.toFixed(3)}\n\nPreço de Venda: R$ ${preco.toFixed(2)}\nLucro por unidade: R$ ${lucro.toFixed(2)}\n\nFórmula: Preço = Custo / (1 - Margem/100)`;

                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('resultContent').style.display = 'block';
                document.getElementById('resultContent').textContent = resultadoGerado;
                document.getElementById('resultActions').style.display = 'flex';

                stopLoading();
                Tools.showToast('Cálculo realizado!', 'success');
            }, 500);
        });

        function copiarResultado() { if (resultadoGerado) Tools.copyToClipboard(resultadoGerado); }
        function baixarTXT() { if (resultadoGerado) Tools.downloadFile(resultadoGerado, 'calculo.txt'); }
        function novaCalculadora() {
            document.getElementById('calculadoraForm').reset();
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('resultContent').style.display = 'none';
            document.getElementById('resultActions').style.display = 'none';
            resultadoGerado = '';
        }
    </script>
</body>
</html>
